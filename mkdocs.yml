site_name: Direnv for Mere Mortals
site_description: The shell helper that loads a project's environment when you enter its folder and unloads it when you leave. Writing .envrc files, trusting them one at a time with allow, layouts that build a Python home for a project, and the security rule that makes the whole arrangement safe.
